<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能体分析器 · 教学版</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:system-ui,sans-serif;background:#0f172a;min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:flex-start;}
        .container{max-width:1200px;width:100%;background:#1e293b;border-radius:24px;padding:30px;border:1px solid #334155;}
        .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #334155;}
        .top-bar .nav{display:flex;gap:8px;flex-wrap:wrap;}
        .top-bar .nav .btn{font-size:13px;padding:6px 16px;}
        .top-bar .nav .btn:disabled{opacity:0.5;cursor:not-allowed;}
        .top-bar .user-info{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:#94a3b8;}
        .h1{color:#f1f5f9;font-size:20px;font-weight:600;margin:0;}
        .sub{color:#94a3b8;font-size:14px;margin-bottom:16px;}
        .row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
        .row input,.row textarea{flex:1;padding:10px 14px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;font-size:14px;font-family:inherit;min-width:120px;}
        .row input:focus,.row textarea:focus{outline:none;border-color:#3b82f6;}
        .row textarea{min-height:60px;resize:vertical;}
        .btn{padding:10px 24px;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
        .btn:active{transform:scale(0.97);}
        .btn-primary{background:#3b82f6;color:white;}
        .btn-primary:hover{background:#2563eb;}
        .btn-success{background:#22c55e;color:white;}
        .btn-success:hover{background:#16a34a;}
        .btn-outline{background:transparent;border:1px solid #475569;color:#94a3b8;}
        .btn-outline:hover{background:#334155;color:#f1f5f9;}
        .btn-sm{padding:6px 14px;font-size:12px;}
        .btn-danger{background:#ef4444;color:white;}
        .btn-danger:hover{background:#dc2626;}
        .btn-warning{background:#f59e0b;color:#0f172a;}
        .btn-warning:hover{background:#d97706;}
        .btn:disabled{opacity:0.5;cursor:not-allowed;}
        .hidden{display:none !important;}
        .status{color:#94a3b8;font-size:13px;margin-top:8px;}
        .status .loading{color:#fbbf24;}
        .status .error{color:#ef4444;}
        .status .success{color:#34d399;}
        .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;}
        .result-card{background:#0f172a;border-radius:12px;padding:16px 18px;border:1px solid #334155;}
        .result-card .card-title{font-weight:600;font-size:14px;color:#94a3b8;margin-bottom:8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1a2332;padding-bottom:6px;}
        .result-card .field{color:#94a3b8;font-weight:500;display:inline-block;min-width:80px;}
        .result-card .value{color:#e2e8f0;}
        .result-card .line{padding:3px 0;font-size:14px;line-height:1.8;}
        .full-width-card{grid-column:1/-1;}
        .tag{display:inline-block;padding:1px 10px;border-radius:12px;font-size:12px;font-weight:500;}
        .tag-pos{background:#22c55e;color:#0f172a;}
        .tag-neu{background:#f59e0b;color:#0f172a;}
        .tag-neg{background:#ef4444;color:white;}
        .tag-high{background:#22c55e;color:#0f172a;}
        .tag-mid{background:#f59e0b;color:#0f172a;}
        .tag-low{background:#64748b;color:white;}
        .tag-urgent{background:#ef4444;color:white;}
        .tag-midurgent{background:#f59e0b;color:#0f172a;}
        .tag-normal{background:#3b82f6;color:white;}
        .role-badge{display:inline-block;padding:3px 14px;border-radius:20px;font-size:12px;font-weight:600;}
        .login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:9999;}
        .login-box{background:#1e293b;padding:40px;border-radius:20px;border:1px solid #334155;max-width:400px;width:90%;text-align:center;position:relative;}
        .login-box h2{color:#f1f5f9;margin-bottom:8px;}
        .login-box .sub{color:#94a3b8;font-size:14px;margin-bottom:20px;}
        .login-box input{width:100%;padding:12px 16px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;font-size:16px;margin-bottom:12px;}
        .login-box input:focus{outline:none;border-color:#3b82f6;}
        .login-box .error{color:#ef4444;font-size:13px;margin-bottom:10px;}
        .login-box .btn{width:100%;}
        .login-box .close-btn{position:absolute;top:12px;right:16px;color:#94a3b8;cursor:pointer;font-size:20px;background:none;border:none;}
        .change-pwd-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:9999;}
        .change-pwd-box{background:#1e293b;padding:40px;border-radius:20px;border:1px solid #334155;max-width:400px;width:90%;text-align:center;position:relative;}
        .change-pwd-box h2{color:#f1f5f9;margin-bottom:8px;}
        .change-pwd-box .sub{color:#94a3b8;font-size:14px;margin-bottom:20px;}
        .change-pwd-box input{width:100%;padding:12px 16px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;font-size:16px;margin-bottom:12px;}
        .change-pwd-box input:focus{outline:none;border-color:#3b82f6;}
        .change-pwd-box .error{color:#ef4444;font-size:13px;margin-bottom:10px;}
        .change-pwd-box .btn{width:100%;}
        .change-pwd-box .close-btn{position:absolute;top:12px;right:16px;color:#94a3b8;cursor:pointer;font-size:20px;background:none;border:none;}
        .school-class-info{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding:10px 16px;background:#0f172a;border-radius:10px;border:1px solid #334155;}
        .school-class-info .label{color:#94a3b8;font-size:13px;}
        .school-class-info .value{color:#f1f5f9;font-size:13px;font-weight:500;}
        .qa-area{margin-top:16px;padding:16px 20px;background:#0f172a;border-radius:12px;border:1px solid #334155;}
        .qa-area .qa-title{color:#94a3b8;font-weight:600;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
        .qa-area .qa-history{color:#e2e8f0;font-size:14px;line-height:1.9;min-height:60px;max-height:200px;overflow-y:auto;white-space:pre-wrap;margin-bottom:8px;padding:8px 12px;background:#0f172a;border-radius:8px;border:1px solid #1a2332;}
        .qa-area .qa-history .q{color:#60a5fa;}
        .qa-area .qa-history .a{color:#34d399;}
        .qa-area .qa-history .empty{color:#64748b;font-style:italic;}
        .upload-area,.batch-area{border:2px dashed #334155;border-radius:16px;padding:20px;text-align:center;color:#94a3b8;cursor:pointer;transition:all 0.2s;}
        .upload-area:hover,.batch-area:hover{border-color:#3b82f6;background:#1a2744;}
        .upload-area.dragover{border-color:#3b82f6;background:#1a2744;}
        .mic-btn{background:#ef4444;color:white;border-radius:50%;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:none;cursor:pointer;transition:all 0.15s;}
        .mic-btn:hover{background:#dc2626;}
        .mic-btn.listening{background:#22c55e;animation:pulse 1s infinite;}
        .mic-status{font-size:12px;color:#94a3b8;margin-left:6px;}
        .mic-status.active{color:#22c55e;}
        .real-time-text{color:#fbbf24;font-size:13px;font-weight:500;margin-left:8px;animation:blink 1s infinite;}
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
        @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
        .batch-item{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid #1a2332;font-size:13px;color:#e2e8f0;}
        .batch-item .status-done{color:#34d399;}
        .batch-item .status-error{color:#ef4444;}
        .batch-summary{display:flex;gap:20px;flex-wrap:wrap;}
        .batch-summary .stat{color:#94a3b8;font-size:13px;}
        .batch-summary .stat .num{color:#f1f5f9;font-weight:600;}
        .file-info{color:#94a3b8;font-size:13px;padding:6px 12px;background:#0f172a;border-radius:8px;display:inline-block;}
        @media(max-width:768px){.card-grid{grid-template-columns:1fr;}.login-box{padding:24px;}.change-pwd-box{padding:24px;}}
    </style>
</head>
<body>
<div class="container">
    <!-- ===== 顶部导航栏 ===== -->
    <div class="top-bar">
        <div>
            <div class="h1">🧠 智能体分析器</div>
            <div style="font-size:12px;color:#94a3b8;" id="roleDisplay">通用分析 · 多场景</div>
        </div>
        <div class="nav">
            <button class="btn btn-primary btn-sm" onclick="goTo('general')">📊 通用分析</button>
            <button class="btn btn-outline btn-sm" id="navStudent" onclick="goTo('student')">📝 学生端</button>
            <button class="btn btn-outline btn-sm" id="navTeacher" onclick="goTo('teacher')">📚 教师端</button>
            <button class="btn btn-danger btn-sm hidden" id="logoutBtn" onclick="logout()">退出登录</button>
            <button class="btn btn-warning btn-sm hidden" id="changePwdBtn" onclick="showChangePwd()">🔑 修改密码</button>
        </div>
        <div class="user-info" id="userInfo">
            <span style="color:#64748b;">未登录</span>
        </div>
    </div>

    <!-- ===== 班级信息 ===== -->
    <div class="school-class-info" id="schoolClassInfo">
        <span class="label">🏫</span>
        <span class="label">学校：</span>
        <span class="value" id="displaySchool">加载中...</span>
        <span class="label" style="margin-left:8px;">📚</span>
        <span class="label">班级：</span>
        <span class="value" id="displayClass">加载中...</span>
        <span class="label" style="margin-left:8px;">👨‍🏫</span>
        <span class="label">教师：</span>
        <span class="value" id="displayTeacher">加载中...</span>
        <span style="margin-left:auto;font-size:12px;color:#64748b;" id="classActionBtn"></span>
    </div>

    <div class="sub">输入文本 → 标准化分析 · 身份隔离 · 班级适配</div>

    <!-- ===== 输入区域 ===== -->
    <div id="generalInputArea">
        <div class="upload-area" id="uploadArea">
            <span style="font-size:30px;display:block;margin-bottom:4px;">📄</span>
            <div class="hint">点击或拖拽上传文件（.txt .pdf .docx）</div>
            <div class="file-name" id="fileName"></div>
            <input type="file" id="fileInput" style="display:none;" accept=".txt,.pdf,.docx">
        </div>
        <div id="fileStatus" class="hidden">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                <span class="file-info">📎 <span id="loadedFileName">-</span></span>
                <button class="btn btn-outline btn-sm" onclick="clearFile()">移除</button>
            </div>
        </div>
        <div class="batch-area" id="batchArea">
            <span style="font-size:24px;display:block;margin-bottom:4px;">📚</span>
            <div class="hint">批量上传（.txt .pdf .docx）</div>
            <input type="file" id="batchFileInput" style="display:none;" accept=".txt,.pdf,.docx" multiple>
        </div>
        <div id="batchProgress" class="hidden">
            <div style="background:#0f172a;border-radius:8px;padding:12px;margin-top:10px;max-height:300px;overflow-y:auto;" id="batchResults"></div>
            <div style="margin-top:10px;padding:12px;background:#0f172a;border-radius:8px;border:1px solid #334155;" id="batchSummary"></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                <button class="btn btn-outline btn-sm" onclick="clearBatch()">清空</button>
                <button class="btn btn-success btn-sm" onclick="exportBatchCSV()">📤 导出CSV</button>
            </div>
        </div>
        <div style="margin-top:12px;">
            <div style="color:#f1f5f9;font-weight:600;font-size:16px;margin-bottom:10px;">输入文本 / 语音</div>
            <div class="row">
                <textarea id="textInput" placeholder="粘贴文本，或点击🎙️说话"></textarea>
            </div>
            <div class="row">
                <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()">🎙️</button>
                <button class="btn btn-primary" onclick="analyzeTextInput()">🔍 分析</button>
                <button class="btn btn-outline btn-sm" onclick="clearTextInput()">清空</button>
                <span class="mic-status" id="micStatus">点击🎙️说话</span>
                <span id="realTimeIndicator" class="real-time-text hidden">● 识别中</span>
            </div>
            <div style="font-size:12px;color:#64748b;margin-top:-4px;margin-bottom:8px;">💡 说完了点击🎙️停止并自动分析</div>
        </div>
    </div>

    <!-- ===== 标准化分析结果 ===== -->
    <div id="actionButtons" style="margin-top:16px;">
        <hr style="border:none;border-top:1px solid #334155;margin:16px 0;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;">
            <button class="btn btn-primary" onclick="fullAnalysis()">🚀 标准化分析</button>
            <button class="btn btn-outline btn-sm" onclick="clearAnalysis()">清空</button>
        </div>
        <div id="resultArea" class="hidden" style="margin-top:12px;">
            <div id="cardOutput"></div>
        </div>
    </div>

    <!-- ===== 自由问答区域 ===== -->
    <div class="qa-area">
        <div class="qa-title">💬 自由问答</div>
        <div class="qa-history" id="qaHistory">
            <span class="empty">加载文本后，在这里提问...</span>
        </div>
        <div class="row" style="margin-top:8px;margin-bottom:0;">
            <input id="questionInput" placeholder="输入你的问题..." style="flex:1;padding:10px 14px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;font-size:14px;min-width:120px;">
            <button class="btn btn-primary" id="askBtn" onclick="askQuestion()" style="padding:10px 20px;">发送</button>
            <button class="btn btn-outline btn-sm" onclick="clearChat()" style="padding:6px 14px;">清空</button>
        </div>
    </div>

    <div class="status" id="status">💡 开始使用</div>
</div>

<!-- ===== 登录弹窗 ===== -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <button class="close-btn" onclick="closeLogin()">✕</button>
        <h2 id="loginTitle">🔐 身份验证</h2>
        <div class="sub" id="loginSub">请输入对应身份的密码</div>
        <input id="loginPassword" type="password" placeholder="请输入密码..." onkeydown="if(event.key==='Enter') confirmLogin()">
        <div id="loginError" class="error hidden">密码错误，请重新输入</div>
        <button class="btn btn-primary" onclick="confirmLogin()">确认</button>
    </div>
</div>

<!-- ===== 修改密码弹窗 ===== -->
<div id="changePwdOverlay" class="change-pwd-overlay">
    <div class="change-pwd-box">
        <button class="close-btn" onclick="closeChangePwd()">✕</button>
        <h2>🔑 修改密码</h2>
        <div class="sub" id="changePwdSub">修改当前身份的登录密码</div>
        <input id="oldPwdInput" type="password" placeholder="请输入旧密码">
        <input id="newPwdInput" type="password" placeholder="请输入新密码">
        <input id="confirmPwdInput" type="password" placeholder="请确认新密码">
        <div id="changePwdError" class="error hidden"></div>
        <div id="changePwdSuccess" class="hidden" style="color:#34d399;font-size:13px;margin-bottom:10px;">✅ 密码修改成功！</div>
        <button class="btn btn-primary" onclick="confirmChangePwd()">确认修改</button>
    </div>
</div>

<script src="data-utils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
// ============================================================
// 通用分析 - 使用统一数据源（data-utils.js）
// ============================================================

const API_BASE = 'http://127.0.0.1:5000';
let uploadedText = '';
let fileName = '直接输入';
let batchResults = [];
let isBatchRunning = false;
let currentUser = null;
let chatHistory = [];

// ============================================================
// 登录相关（使用 data-utils.js 中的密码函数）
// ============================================================
function goTo(target) {
    if (target === 'general') {
        window.location.href = 'index.html';
        return;
    }
    if (!currentUser) {
        showLogin(target);
        return;
    }
    if (currentUser.role === 'admin') {
        window.location.href = target + '.html';
        return;
    }
    if (target === 'teacher' && currentUser.role === 'student') {
        alert('❌ 学生身份无权访问教师端');
        return;
    }
    if (target === 'student' && currentUser.role === 'teacher') {
        alert('❌ 教师身份无权访问学生端');
        return;
    }
    if (currentUser.role === target) {
        window.location.href = target + '.html';
        return;
    }
    showLogin(target);
}

function showLogin(role) {
    const overlay = document.getElementById('loginOverlay');
    const title = document.getElementById('loginTitle');
    const sub = document.getElementById('loginSub');
    const error = document.getElementById('loginError');
    overlay.style.display = 'flex';
    error.classList.add('hidden');
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginPassword').focus();
    if (role === 'student') {
        title.textContent = '🎓 学生端验证';
        sub.textContent = '请输入学生身份密码';
    } else if (role === 'teacher') {
        title.textContent = '👨‍🏫 教师端验证';
        sub.textContent = '请输入教师身份密码';
    }
    window._loginTarget = role;
}

function closeLogin() {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('loginError').classList.add('hidden');
}

function confirmLogin() {
    const password = document.getElementById('loginPassword').value.trim();
    const role = window._loginTarget;
    const error = document.getElementById('loginError');
    if (!password) {
        error.textContent = '请输入密码';
        error.classList.remove('hidden');
        return;
    }
    if (password === getPassword('admin')) {
        currentUser = { role: 'admin' };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        error.classList.add('hidden');
        closeLogin();
        if (role === 'student') window.location.href = 'student.html';
        else if (role === 'teacher') window.location.href = 'teacher.html';
        else window.location.href = 'index.html';
        return;
    }
    if (password === getPassword(role)) {
        currentUser = { role: role };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        error.classList.add('hidden');
        closeLogin();
        window.location.href = role + '.html';
    } else {
        error.textContent = '密码错误，请重新输入';
        error.classList.remove('hidden');
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginPassword').focus();
    }
}

function checkLoginStatus() {
    const saved = localStorage.getItem('currentUser');
    if (saved) {
        try {
            currentUser = JSON.parse(saved);
            updateUI(currentUser.role);
        } catch(e) { currentUser = null; }
    }
    updateClassDisplay();
}

function updateUI(role) {
    const userInfo = document.getElementById('userInfo');
    const logoutBtn = document.getElementById('logoutBtn');
    const changePwdBtn = document.getElementById('changePwdBtn');
    const studentBtn = document.getElementById('navStudent');
    const teacherBtn = document.getElementById('navTeacher');
    const roleDisplay = document.getElementById('roleDisplay');
    
    if (studentBtn) { studentBtn.disabled = false; studentBtn.style.opacity = '1'; studentBtn.style.cursor = 'pointer'; }
    if (teacherBtn) { teacherBtn.disabled = false; teacherBtn.style.opacity = '1'; teacherBtn.style.cursor = 'pointer'; }
    
    if (role === 'student') {
        userInfo.innerHTML = '<span class="role-badge" style="background:#22c55e;color:#0f172a;">🎓 学生</span>';
        logoutBtn.classList.remove('hidden');
        changePwdBtn.classList.remove('hidden');
        if (roleDisplay) roleDisplay.textContent = '🎓 学生 · 通用分析';
        if (teacherBtn) { teacherBtn.disabled = true; teacherBtn.style.opacity = '0.5'; teacherBtn.style.cursor = 'not-allowed'; }
    } else if (role === 'teacher') {
        userInfo.innerHTML = '<span class="role-badge" style="background:#3b82f6;color:white;">👨‍🏫 教师</span>';
        logoutBtn.classList.remove('hidden');
        changePwdBtn.classList.remove('hidden');
        if (roleDisplay) roleDisplay.textContent = '👨‍🏫 教师 · 通用分析';
        if (studentBtn) { studentBtn.disabled = true; studentBtn.style.opacity = '0.5'; studentBtn.style.cursor = 'not-allowed'; }
    } else if (role === 'admin') {
        userInfo.innerHTML = '<span class="role-badge" style="background:#8b5cf6;color:white;">👑 管理员</span>';
        logoutBtn.classList.remove('hidden');
        changePwdBtn.classList.remove('hidden');
        if (roleDisplay) roleDisplay.textContent = '👑 管理员 · 全端口';
    } else {
        userInfo.innerHTML = '<span style="color:#64748b;">未登录</span>';
        logoutBtn.classList.add('hidden');
        changePwdBtn.classList.add('hidden');
        if (roleDisplay) roleDisplay.textContent = '通用分析 · 多场景';
    }
}

function logout() {
    if (!confirm('确认退出登录？')) return;
    currentUser = null;
    localStorage.removeItem('currentUser');
    updateUI(null);
    window.location.href = 'index.html';
}

function updateClassDisplay() {
    const saved = localStorage.getItem('currentUser');
    const schoolEl = document.getElementById('displaySchool');
    const classEl = document.getElementById('displayClass');
    const teacherEl = document.getElementById('displayTeacher');
    const actionBtn = document.getElementById('classActionBtn');
    
    if (!saved) {
        schoolEl.textContent = '未登录';
        classEl.textContent = '未登录';
        teacherEl.textContent = '未登录';
        actionBtn.textContent = '';
        return;
    }
    const user = JSON.parse(saved);
    
    if (user.role === 'teacher') {
        const teacherData = getTeacherData();
        const className = teacherData.current_class || Object.keys(teacherData.classes || {})[0] || '未绑定';
        const classData = (teacherData.classes || {})[className] || {};
        schoolEl.textContent = classData.school || '未绑定';
        classEl.textContent = className;
        teacherEl.textContent = teacherData.teacher_name || '未绑定';
        actionBtn.textContent = '📌 教师：' + Object.keys(teacherData.classes || {}).length + '个班级';
    } else if (user.role === 'student') {
        const teacherData = getTeacherData();
        const className = teacherData.current_class || Object.keys(teacherData.classes || {})[0] || '未绑定';
        const classData = (teacherData.classes || {})[className] || {};
        schoolEl.textContent = classData.school || '未绑定';
        classEl.textContent = className;
        teacherEl.textContent = teacherData.teacher_name || '未绑定';
        actionBtn.textContent = '📌 学生端';
    } else if (user.role === 'admin') {
        const teacherData = getTeacherData();
        const classCount = Object.keys(teacherData.classes || {}).length;
        schoolEl.textContent = '管理员';
        classEl.textContent = classCount > 0 ? '共 ' + classCount + ' 个班级' : '暂无班级';
        teacherEl.textContent = teacherData.teacher_name || '系统管理员';
        actionBtn.textContent = '👑 管理员全通';
    } else {
        schoolEl.textContent = '未登录';
        classEl.textContent = '未登录';
        teacherEl.textContent = '未登录';
        actionBtn.textContent = '';
    }
}

    document.getElementById('changePwdOverlay').style.display = 'flex';
    document.getElementById('oldPwdInput').value = '';
    document.getElementById('newPwdInput').value = '';

    document.getElementById('changePwdSub').textContent = '修改「' + (roleMap[currentUser.role] || '未知') + '」身份密码';

function closeChangePwd() {
    document.getElementById('changePwdOverlay').style.display = 'none';
}

function confirmChangePwd() {
    const oldPwd = document.getElementById('oldPwdInput').value.trim();
    const newPwd = document.getElementById('newPwdInput').value.trim();
    const confirmPwd = document.getElementById('confirmPwdInput').value.trim();
    const error = document.getElementById('changePwdError');
    const success = document.getElementById('changePwdSuccess');
    error.classList.add('hidden');
    success.classList.add('hidden');
    if (!oldPwd) { error.textContent = '请输入旧密码'; error.classList.remove('hidden'); return; }
    if (!newPwd || newPwd.length < 4) { error.textContent = '新密码长度至少4位'; error.classList.remove('hidden'); return; }
    if (newPwd !== confirmPwd) { error.textContent = '两次输入的新密码不一致'; error.classList.remove('hidden'); return; }
    const currentPwd = getPassword(currentUser.role);
    if (oldPwd !== currentPwd) { error.textContent = '旧密码错误'; error.classList.remove('hidden'); return; }
    setPassword(currentUser.role, newPwd);
    success.textContent = '✅ 密码修改成功！';
    success.classList.remove('hidden');
    document.getElementById('oldPwdInput').value = '';
    document.getElementById('newPwdInput').value = '';
    document.getElementById('confirmPwdInput').value = '';
    setTimeout(() => { closeChangePwd(); alert('密码已修改，请重新登录'); logout(); }, 1500);
}

// 语音识别
// ============================================================
let recognition = null;
let isListening = false;
let voiceFinalText = '';
let voiceRestartTimer = null;
let voiceManualStop = false;

function toggleVoiceInput() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        setStatus('❌ 浏览器不支持语音识别，请使用 Chrome 或 Edge', 'error');
        return;
    }
    if (isListening) { stopVoiceInput(); return; }
    startVoiceInput();
}

function startVoiceInput() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    voiceFinalText = '';
    voiceManualStop = false;
    let hasResult = false;
    if (voiceRestartTimer) { clearTimeout(voiceRestartTimer); voiceRestartTimer = null; }
    
    recognition.onstart = function() {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('micBtn').textContent = '⏹';
        document.getElementById('realTimeIndicator').classList.remove('hidden');
        document.getElementById('micStatus').textContent = '🎤 录音中... 点击🎙️停止';
        document.getElementById('micStatus').className = 'mic-status active';
        setStatus('🎤 正在聆听，说完了点击🎙️停止', 'loading');
        document.getElementById('textInput').placeholder = '🎤 正在倾听...';
        hasResult = false;
    };
    
    recognition.onresult = function(event) {
        let currentFinal = '', currentInterim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) currentFinal += transcript;
            else currentInterim += transcript;
        }
        if (currentFinal) { voiceFinalText += currentFinal; hasResult = true; }
        const displayText = voiceFinalText + (currentInterim ? ' ' + currentInterim : '');
        if (displayText.trim()) {
            document.getElementById('textInput').value = displayText;
            document.getElementById('textInput').scrollTop = document.getElementById('textInput').scrollHeight;
        }
    };
    
    recognition.onerror = function(event) {
        if (event.error === 'no-speech' || event.error === 'aborted') return;
        let msg = '❌ 识别错误';
        if (event.error === 'not-allowed') msg = '❌ 请允许麦克风权限';
        else if (event.error === 'audio-capture') msg = '❌ 麦克风不可用';
        else if (event.error === 'network') msg = '❌ 网络错误';
        setStatus(msg, 'error');
        stopVoiceInput();
    };
    
    recognition.onend = function() {
        if (voiceManualStop || hasResult || voiceFinalText.trim()) {
            const currentText = document.getElementById('textInput').value.trim();
            if (currentText) { voiceFinalText = currentText; finishVoiceRecognition(currentText); return; }
            else if (voiceFinalText.trim()) { finishVoiceRecognition(voiceFinalText.trim()); return; }
        }
        if (!voiceRestartTimer && !voiceManualStop) {
            voiceRestartTimer = setTimeout(() => {
                voiceRestartTimer = null;
                if (isListening && !voiceManualStop) {
                    try { recognition.start(); } catch(e) { stopVoiceInput(); }
                }
            }, 300);
            return;
        }
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('micBtn').textContent = '🎙️';
        document.getElementById('realTimeIndicator').classList.add('hidden');
        if (!voiceFinalText.trim()) {
            document.getElementById('micStatus').textContent = '点击🎙️说话';
            document.getElementById('micStatus').className = 'mic-status';
            document.getElementById('textInput').placeholder = '粘贴文本，或点击🎙️说话';
            if (!voiceManualStop) { setStatus('⏱️ 未检测到语音，请重试', 'error'); }
        }
        voiceManualStop = false;
        if (voiceRestartTimer) { clearTimeout(voiceRestartTimer); voiceRestartTimer = null; }
    };
    try { recognition.start(); } catch (e) {
        setStatus('❌ 启动失败: ' + e.message, 'error');
        stopVoiceInput();
    }
}

function finishVoiceRecognition(text) {
    if (!text || !text.trim()) { stopVoiceInput(); return; }
    const englishRatio = (text.match(/[a-zA-Z]/g) || []).length / (text.length || 1);
    const detectedLang = englishRatio > 0.3 ? '英文' : '中文';
    document.getElementById('textInput').value = text.trim();
    document.getElementById('micStatus').textContent = '✅ 已识别 (' + detectedLang + ')';
    document.getElementById('micStatus').className = 'mic-status active';
    document.getElementById('realTimeIndicator').classList.add('hidden');
    setStatus('✅ 语音识别完成（' + detectedLang + '），自动分析中...', 'success');
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
    document.getElementById('micBtn').textContent = '🎙️';
    if (voiceRestartTimer) { clearTimeout(voiceRestartTimer); voiceRestartTimer = null; }
    setTimeout(() => { if (document.getElementById('textInput').value.trim()) { analyzeTextInput(); } }, 200);
}

function stopVoiceInput() {
    voiceManualStop = true;
    isListening = false;
    if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
    if (voiceRestartTimer) { clearTimeout(voiceRestartTimer); voiceRestartTimer = null; }
    document.getElementById('micBtn').classList.remove('listening');
    document.getElementById('micBtn').textContent = '🎙️';
    document.getElementById('realTimeIndicator').classList.add('hidden');
    if (document.getElementById('textInput').value.trim()) {
        document.getElementById('micStatus').textContent = '✅ 已识别';
        document.getElementById('micStatus').className = 'mic-status active';
        setTimeout(() => { if (document.getElementById('textInput').value.trim()) { analyzeTextInput(); } }, 200);
    } else {
        document.getElementById('micStatus').textContent = '点击🎙️说话';
        document.getElementById('micStatus').className = 'mic-status';
        document.getElementById('textInput').placeholder = '粘贴文本，或点击🎙️说话';
    }
}

async function handleFile(file) {
    const ext = '.' + file.name.split('.').pop().toLowerCase();
    if (!['.txt','.pdf','.docx'].includes(ext)) { setStatus('⚠️ 支持 .txt .pdf .docx', 'error'); return; }
    setStatus('⏳ 读取文件...', 'loading');
    try {
        let text = '';
        if (ext === '.txt') text = await readTxtFile(file);
        else if (ext === '.pdf') text = await readPdfFile(file);
        else if (ext === '.docx') text = await readDocxFile(file);
        loadedFileName.textContent = file.name;
        fileNameDisplay.textContent = '📎 ' + file.name;
        fileStatus.classList.remove('hidden');
        loadText(text, file.name);
    } catch (e) { setStatus('❌ 解析失败: ' + e.message, 'error'); }
}

function readTxtFile(file) { return new Promise((r,e) => { const fr = new FileReader(); fr.onload = (ev) => r(ev.target.result); fr.onerror = () => e(new Error('读取失败')); fr.readAsText(file); }); }
async function readPdfFile(file) { const buf = await file.arrayBuffer(); const pdf = await pdfjsLib.getDocument({data:buf}).promise; let txt=''; for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const ct=await pg.getTextContent(); txt+=ct.items.map(it=>it.str).join(' ')+'\n'; } return txt||'PDF无文字'; }
async function readDocxFile(file) { const buf=await file.arrayBuffer(); const res=await mammoth.extractRawText({arrayBuffer:buf}); return res.value||'DOCX无文字'; }

function loadText(text, name) {
    uploadedText = text;
    fileName = name || '直接输入';
    resultArea.classList.add('hidden');
    setStatus('✅ 已加载 ' + uploadedText.length + ' 字符', 'success');
    chatHistory = [];
    document.getElementById('qaHistory').innerHTML = '<span class="empty">已加载文本，可以提问了</span>';
}

function clearFile() {
    fileStatus.classList.add('hidden');
    fileNameDisplay.textContent = '';
    loadedFileName.textContent = '';
    fileInput.value = '';
    if (!textInput.value.trim()) { uploadedText = ''; resultArea.classList.add('hidden'); }
    setStatus('💡 已移除', '');
}

async function callAI(messages, actionName) {
    if (!uploadedText) { setStatus('⚠️ 请先加载文本', 'error'); return null; }
    setStatus('⏳ ' + actionName + '...', 'loading');
    try {
        const res = await fetch(API_BASE + '/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: uploadedText })
        });
        const data = await res.json();
        if (data.success) {
            setStatus('✅ ' + actionName + '完成', 'success');
            return data.result;
        } else {
            setStatus('❌ ' + (data.error || '分析失败'), 'error');
            return null;
        }
    } catch (e) {
        setStatus('❌ 网络错误: ' + e.message + '（请确认本地API服务已启动）', 'error');
        return null;
    }
}

    const s = data.情感分析 || {};
    html += `<div class="result-card"><div class="card-title">📊 情感分析</div>`;

    html += `<div class="line"><span class="field">意图描述</span> <span class="value">${i.意图描述 || '-'}</span></div></div>`;

    html += `<div class="line"><span class="field">等级</span> ${tag(u.等级 || '一般')}</div>`;

async function fullAnalysis() {
    const textFromInput = textInput.value.trim();

    if (!uploadedText) { setStatus('⚠️ 请先输入或上传文本', 'error'); return; }
    const result = await callAI([], '标准化分析');
    if (result) {
        try {
            const parsed = typeof result === 'string' ? JSON.parse(result) : result;
            renderCards(parsed);
            setStatus('✅ 分析完成', 'success');
        } catch (e) {
            cardOutput.innerHTML = '<div class="result-box" style="color:#ef4444;">❌ 结果解析失败，请重试</div>';
            resultArea.classList.remove('hidden');
            setStatus('❌ 结果解析失败', 'error');
        }
    }
}

// ============================================================
batchArea.addEventListener('click', () => batchFileInput.click());
batchFileInput.addEventListener('change', (e) => { if (e.target.files.length) handleBatchFiles(e.target.files); });

async function handleBatchFiles(files) {
    if (isBatchRunning) { setStatus('⏳ 批量处理中，请等待...', 'error'); return; }
    const supported = Array.from(files).filter(f => ['.txt','.pdf','.docx'].includes('.' + f.name.split('.').pop().toLowerCase()));
    if (supported.length === 0) { setStatus('⚠️ 请选择 .txt .pdf .docx 文件', 'error'); return; }
    batchResults = [];
    batchProgress.classList.remove('hidden');
    batchResultsDiv.innerHTML = '';
    isBatchRunning = true;
    setStatus('⏳ 批量处理中... 0/' + supported.length, 'loading');
    let completed = 0;
    for (const file of supported) {
        try {
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            let text = '';
            if (ext === '.txt') text = await readTxtFile(file);
            else if (ext === '.pdf') text = await readPdfFile(file);
            else if (ext === '.docx') text = await readDocxFile(file);
            if (!text || text.trim().length === 0) throw new Error('文件内容为空');
            batchResults.push({ name: file.name, text: text.slice(0,80)+'...', success: true });
        } catch (e) {
            batchResults.push({ name: file.name, text: '', success: false });
        }
        completed++;
        let html = '';
        batchResults.forEach((r, i) => {
            const statusClass = r.success ? 'status-done' : 'status-error';
            const statusText = r.success ? '✅' : '❌';
            html += `<div class="batch-item"><span>${i+1}. ${r.name}</span><span class="${statusClass}">${statusText}</span></div>`;
        });
        batchResultsDiv.innerHTML = html;
        setStatus('⏳ 批量处理中... ' + completed + '/' + supported.length, 'loading');
    }
    isBatchRunning = false;
    const total = batchResults.length;
    const success = batchResults.filter(r => r.success).length;
    batchSummary.innerHTML = '<span class="stat">📊 总计: <span class="num">' + total + '</span> 个</span><span class="stat">✅ 成功: <span class="num">' + success + '</span></span>';
    setStatus('✅ 批量处理完成！共 ' + total + ' 个文件', 'success');
}

function clearBatch() { batchResults = []; batchProgress.classList.add('hidden'); batchResultsDiv.innerHTML = ''; batchSummary.innerHTML = ''; batchFileInput.value = ''; setStatus('💡 已清空批量结果', ''); }

function exportBatchCSV() {
    if (batchResults.length === 0) { setStatus('⚠️ 没有数据可导出', 'error'); return; }
    let csv = '文件名,状态\n';
    batchResults.forEach(r => { csv += r.name + ',' + (r.success ? '成功' : '失败') + '\n'; });
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '批量分析结果_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    setStatus('✅ CSV 导出成功', 'success');
}

}

function clearChat() {
    chatHistory = [];
    renderChatHistory();
    setStatus('💡 对话已清空', '');
}

async function askQuestion() {
    const question = document.getElementById('questionInput').value.trim();
    if (!question) { setStatus('⚠️ 请输入问题', 'error'); return; }
    if (!uploadedText) { setStatus('⚠️ 请先加载文本（上传或粘贴文本后点击分析）', 'error'); return; }
    
    addChatMessage('user', question);
    document.getElementById('questionInput').value = '';
    
    const messages = [
        { role: 'system', content: '你是专业助手。基于已加载的文本内容回答用户的问题。回答要准确、简洁，基于文本内容。如果问题与文本无关，请礼貌地说明。' },
        { role: 'user', content: `文件内容：\n${uploadedText.slice(0, 8000)}${uploadedText.length > 8000 ? '\n... (截断)' : ''}\n\n用户问题：${question}` }
    ];
    
    const result = await callAI(messages, '回答');
    if (result) {
        let answer = result;
        if (typeof result === 'object') {
            answer = JSON.stringify(result, null, 2);
        }
        addChatMessage('assistant', answer);
    }
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.activeElement === document.getElementById('questionInput')) {
        if (e.shiftKey) return;
        e.preventDefault();
        askQuestion();
    }
});

// ============================================================
// 初始化
// ============================================================
checkLoginStatus();
</script>
